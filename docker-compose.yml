services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumeee:latest
    container_name: resumeee-server
    command: ["server"]
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/resumeee.db
      - ADMIN_MODE=${ADMIN_MODE:-false}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-default}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - LLM_DAILY_REQUEST_LIMIT=${LLM_DAILY_REQUEST_LIMIT:-50}
      - LLM_MONTHLY_TOKEN_LIMIT=${LLM_MONTHLY_TOKEN_LIMIT:-1000000}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - WORKER_QUEUE_SIZE=${WORKER_QUEUE_SIZE:-100}
      - MAX_CONCURRENT_JOBS_PER_TENANT=${MAX_CONCURRENT_JOBS_PER_TENANT:-2}
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Hosted LLM API Keys (injected from host environment)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # OpenAI-Compatible / Ollama endpoint
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-ollama}
    volumes:
      - resumeee-data:/data
    networks:
      - resumeee-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      ollama:
        condition: service_started
        required: false

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: resumeee-web:latest
    container_name: resumeee-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - ADMIN_MODE=${ADMIN_MODE:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
    networks:
      - resumeee-net
    depends_on:
      server:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: resumeee-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - resumeee-net
    profiles:
      - local-llm

volumes:
  resumeee-data:
    name: resumeee-data
  ollama-data:
    name: ollama-data

networks:
  resumeee-net:
    name: resumeee-net
    driver: bridge
