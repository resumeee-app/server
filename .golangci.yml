version: "2"
linters:
  default: none
  enable:
    - errcheck
    - forcetypeassert
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
formatters:
  enable:
    - gofmt
